name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:                       # haftalık tazelik kontrolü
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Geliştirme bağımlılıkları (sürüm sınırları pyproject.toml [dev]'de tanımlıdır)
        run: |
          python -m pip install --upgrade pip
          # Tam sürüm kilidi: pyproject aralıkları + scripts/kisitlar-dev.txt
          python -m pip install -e ".[dev]" -c scripts/kisitlar-dev.txt
      - name: Kapı (ruff + mypy + pytest/cov)
        # Windows'ta bash git-runtime ile gelir; check.sh iki platformda da çalışır
        shell: bash
        run: bash scripts/check.sh
      - name: Kod kokusu kendi kendine test (örnek tutarlı depo → 0)
        shell: bash
        run: python -m runtime_pin_sync.cli ornek-depolar/tutarli
      - name: Kod kokusu kendi kendine test (örnek tutarlı depo, İngilizce kip → 0)
        shell: bash
        run: python -m runtime_pin_sync.cli ornek-depolar/tutarli --lang en
      - name: Kod kokusu kendi kendine test (örnek uyumsuz depo → 1)
        shell: bash
        # uyumsuz Depo BİLEREK çelişkili; çıkış kodu TAM 1 olmalı
        # (kullanım hatası 2 / çökme ≠1 geçmesin)
        run: |
          set +e
          python -m runtime_pin_sync.cli ornek-depolar/uyumsuz
          rc=$?
          set -e
          if [ "$rc" -ne 1 ]; then
            echo "BEKLENEN çıkış kodu 1, ALINAN $rc"; exit 1
          fi

  paket:
    name: wheel · temiz kurulum (sıfır bağımlılık)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Wheel ve sdist üret
        run: |
          python -m pip install --upgrade pip
          python -m pip install build -c scripts/kisitlar-dev.txt
          python -m build --outdir dist
      - name: Yalnız wheel'i temiz sanal ortama kur
        shell: bash
        # --no-index + --find-links: PyPI'ya hiç bakılmaz; kurulumun yalnız
        # wheel'den ve sıfır çalışma zamanı bağımlılığıyla yapılabildiğini kanıtlar.
        run: |
          python -m venv "$RUNNER_TEMP/temiz"
          PY="$RUNNER_TEMP/temiz/bin/python"
          BIN="$RUNNER_TEMP/temiz/bin/runtime-pin-sync"
          "$PY" -m pip install --no-index --find-links dist runtime-pin-sync
          "$PY" -m pip check
          "$BIN" --version
          "$BIN" ornek-depolar/tutarli
          set +e
          "$BIN" ornek-depolar/uyumsuz
          rc=$?
          set -e
          if [ "$rc" -ne 1 ]; then
            echo "KURULU WHEEL: BEKLENEN çıkış kodu 1, ALINAN $rc"; exit 1
          fi
      - name: Kurulu paket sürümü pyproject ile aynı mı
        shell: bash
        run: |
          sürüm="$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])")"
          "$RUNNER_TEMP/temiz/bin/runtime-pin-sync" --version | grep -q " $sürüm$"
