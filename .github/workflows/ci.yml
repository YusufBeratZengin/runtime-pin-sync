name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:                       # haftalık tazelik kontrolü
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Geliştirme bağımlılıkları (sürüm sınırları pyproject.toml [dev]'de tanımlıdır)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Kapı (ruff + mypy + pytest/cov)
        # Windows'ta bash git-runtime ile gelir; check.sh iki platformda da çalışır
        shell: bash
        run: bash scripts/check.sh
      - name: Kod kokusu kendi kendine test (örnek tutarlı depo → 0)
        shell: bash
        run: python -m runtime_pin_sync.cli ornek-depolar/tutarli
      - name: Kod kokusu kendi kendine test (örnek tutarlı depo, İngilizce kip → 0)
        shell: bash
        run: python -m runtime_pin_sync.cli ornek-depolar/tutarli --lang en
      - name: Kod kokusu kendi kendine test (örnek uyumsuz depo → 1)
        shell: bash
        # uyumsuz Depo BİLEREK çelişkili; çıkış kodu TAM 1 olmalı
        # (kullanım hatası 2 / çökme ≠1 geçmesin)
        run: |
          set +e
          python -m runtime_pin_sync.cli ornek-depolar/uyumsuz
          rc=$?
          set -e
          if [ "$rc" -ne 1 ]; then
            echo "BEKLENEN çıkış kodu 1, ALINAN $rc"; exit 1
          fi
